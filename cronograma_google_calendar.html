<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Semanal + Google Calendar</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 14px; margin-bottom: 15px; }
        .google-auth { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 15px; background: rgba(0,0,0,0.1); border-radius: 8px; }
        .auth-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; background: white; color: #667eea; }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .sync-status { display: inline-block; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-left: 10px; }
        .sync-status.synced { background: #10b981; color: white; }
        .sync-status.syncing { background: #f59e0b; color: white; }
        .sync-status.error { background: #ef4444; color: white; }
        .sync-status.disconnected { background: #6b7280; color: white; }
        .user-info { text-align: center; padding: 10px; color: white; font-size: 14px; }
        .month-info { text-align: center; padding: 10px; color: rgba(255,255,255,0.9); font-size: 13px; font-style: italic; }
        .tabs { display: flex; background: #f5f5f5; border-bottom: 1px solid #ddd; overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 120px; padding: 15px; background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 600; color: #666; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab-btn.active { color: #667eea; border-bottom-color: #667eea; }
        .content { padding: 30px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background: #f0f0f0; padding: 12px; text-align: left; font-weight: 600; color: #333; border-bottom: 2px solid #ddd; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .time { color: #667eea; font-weight: 600; min-width: 80px; cursor: pointer; }
        .edit-btn { background: none; border: none; color: #667eea; cursor: pointer; padding: 4px 8px; margin-left: 10px; opacity: 0; }
        .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; padding: 4px 8px; margin-left: 5px; opacity: 0; }
        tr:hover .edit-btn, tr:hover .delete-btn { opacity: 1; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background-color: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .modal-btn.save { background: #667eea; color: white; }
        .modal-btn.cancel { background: #f0f0f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Cronograma Semanal + Google Calendar</h1>
            <div class="google-auth">
                <button class="auth-btn" id="connectBtn" onclick="handleConnectClick()">🔗 Conectar Google</button>
                <button class="auth-btn" id="syncBtn" onclick="syncNow()" disabled>🔄 Sincronizar Agora</button>
                <button class="auth-btn" id="desyncBtn" onclick="desyncNow()" disabled style="background: #ef4444; color: white;">🗑️ Dessincronizar</button>
                <span class="sync-status disconnected" id="syncStatus">🔴 Desconectado</span>
            </div>
            <div class="user-info" id="userInfo"></div>
            <div class="month-info" id="monthInfo"></div>
        </div>

        <div class="content">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('segunda', event)">Seg</button>
                <button class="tab-btn" onclick="switchTab('terca', event)">Ter</button>
                <button class="tab-btn" onclick="switchTab('quarta', event)">Qua</button>
                <button class="tab-btn" onclick="switchTab('quinta', event)">Qui</button>
                <button class="tab-btn" onclick="switchTab('sexta', event)">Sex</button>
                <button class="tab-btn" onclick="switchTab('sabado', event)">Sab</button>
                <button class="tab-btn" onclick="switchTab('domingo', event)">Dom</button>
            </div>

            <!-- Tabelas omitidas por brevidade, mantêm a estrutura original com os IDs -->
            <div id="segunda" class="tab-content active"><table id="segunda-table"><tr><th>Horário</th><th>Atividade</th></tr>
                <tr><td class="time" onclick="editTime('segunda', this, '08:00')">08:00</td><td class="activity-cell">Acordar, banho e escovar os dentes <button class="edit-btn" onclick="openEditModal('segunda', '08:00', 'Acordar, banho e escovar os dentes', event)">✏️</button><button class="delete-btn" onclick="deleteActivity('segunda', this, event)">🗑️</button></td></tr>
            </table></div>
            <!-- ... (demais tabelas seguem o padrão) ... -->
        </div>
    </div>

    <script>
        const CLIENT_ID = '405103894296-n00m60mb021u4os48kcnl4lmhmjkm6oe.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/calendar';
        let isAuthenticated = false, tokenClient;

        function initializeGoogleAuth() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: SCOPES, callback: (res) => { if (res.access_token) { isAuthenticated = true; localStorage.setItem('googleToken', res.access_token); updateAuthUI(); } }
            });
            if (localStorage.getItem('googleToken')) { isAuthenticated = true; updateAuthUI(); }
        }

        function generateValidEventId(date, time) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const [hour, minute] = time.split(':');
            return `cron-${year}${month}${day}-${hour}${minute}`;
        }

        function formatISOWithOffset(date) {
            const pad = (n) => String(n).padStart(2, '0');
            const tzo = -date.getTimezoneOffset();
            const diff = tzo >= 0 ? '+' : '-';
            return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds()) + diff + pad(Math.floor(Math.abs(tzo) / 60)) + ':' + pad(Math.abs(tzo) % 60);
        }

        async function syncWithGoogleCalendar() {
            const token = localStorage.getItem('googleToken');
            const activities = getAllActivitiesFromSchedule();
            const today = new Date();
            const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();

            for (let day = 1; day <= lastDay; day++) {
                const date = new Date(today.getFullYear(), today.getMonth(), day);
                const dayName = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'][date.getDay()];
                
                for (let activity of activities.filter(a => a.day === dayName)) {
                    const eventId = generateValidEventId(date, activity.time);
                    const event = {
                        id: eventId,
                        summary: activity.activity,
                        start: { dateTime: formatISOWithOffset(new Date(date.setHours(...activity.time.split(':')))), timeZone: 'America/Sao_Paulo' },
                        end: { dateTime: formatISOWithOffset(new Date(date.setHours(parseInt(activity.time.split(':')[0]) + 1, activity.time.split(':')[1]))), timeZone: 'America/Sao_Paulo' }
                    };

                    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify(event)
                    }).then(res => res.status === 404 ? fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', { method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(event) }) : res);
                }
            }
            alert('Sincronização concluída!');
        }

        // Adicione as funções restantes (handleConnectClick, desyncNow, etc) aqui.
        window.addEventListener('load', initializeGoogleAuth);
    </script>
</body>
</html>
