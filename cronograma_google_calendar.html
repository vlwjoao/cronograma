<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Semanal + Google Calendar</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 14px; margin-bottom: 15px; }
        .google-auth { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 15px; background: rgba(0,0,0,0.1); border-radius: 8px; }
        .auth-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; background: white; color: #667eea; }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .sync-status { display: inline-block; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-left: 10px; }
        .sync-status.synced { background: #10b981; color: white; }
        .sync-status.syncing { background: #f59e0b; color: white; }
        .sync-status.error { background: #ef4444; color: white; }
        .sync-status.disconnected { background: #6b7280; color: white; }
        .user-info { text-align: center; padding: 10px; color: white; font-size: 14px; }
        .month-info { text-align: center; padding: 10px; color: rgba(255,255,255,0.9); font-size: 13px; font-style: italic; }
        .tabs-header { display: flex; align-items: center; background: #f5f5f5; border-bottom: 1px solid #ddd; }
        .tabs { display: flex; flex: 1; overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 100px; padding: 15px; background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 600; color: #666; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab-btn:hover { background: #efefef; color: #333; }
        .tab-btn.active { color: #667eea; border-bottom-color: #667eea; }
        .add-act-btn { background: #667eea; color: white; border: none; font-size: 20px; font-weight: bold; width: 42px; height: 42px; border-radius: 50%; margin: 0 15px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .add-act-btn:hover { background: #5568d3; transform: scale(1.05); }
        .content { padding: 30px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background: #f0f0f0; padding: 12px; text-align: left; font-weight: 600; color: #333; border-bottom: 2px solid #ddd; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; }
        .time { color: #667eea; font-weight: 600; min-width: 80px; }
        .edit-btn, .delete-btn { background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0; transition: opacity 0.2s; padding: 4px 8px; margin-left: 5px; }
        .edit-btn { color: #667eea; }
        .delete-btn { color: #ef4444; }
        tr:hover .edit-btn, tr:hover .delete-btn { opacity: 1; }
        .sync-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: #10b981; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background-color: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
        .modal-header { margin-bottom: 20px; }
        .modal-header h2 { color: #333; font-size: 18px; margin-bottom: 5px; }
        .modal-body { margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #555; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 14px; }
        .days-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
        .day-checkbox { display: none; }
        .day-label { padding: 6px 12px; background: #f0f0f0; border-radius: 20px; font-size: 12px; font-weight: 600; color: #555; cursor: pointer; transition: all 0.2s; }
        .day-checkbox:checked + .day-label { background: #667eea; color: white; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .modal-btn.save { background: #667eea; color: white; }
        .modal-btn.cancel { background: #f0f0f0; color: #333; }
        .config-message { background: #fef3c7; border: 1px solid #fbbf24; color: #92400e; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Cronograma Semanal + Google Calendar</h1>
            <p>Sincronização automática com sua agenda Google</p>
            <div class="google-auth">
                <button class="auth-btn" id="connectBtn" onclick="handleConnectClick()">🔗 Conectar Google</button>
                <button class="auth-btn" id="syncBtn" onclick="syncNow()" disabled>🔄 Sincronizar Agora</button>
                <button class="auth-btn" id="desyncBtn" onclick="desyncNow()" disabled style="background: #ef4444; color: white;">🗑️ Dessincronizar</button>
                <span class="sync-status disconnected" id="syncStatus">🔴 Desconectado</span>
            </div>
            <div class="user-info" id="userInfo"></div>
            <div class="month-info" id="monthInfo"></div>
        </div>

        <div class="content">
            <div class="config-message">
                <p><strong>💡 Dica:</strong> Edite suas atividades neste mês e clique em "🔄 Sincronizar Agora" para enviar tudo ao Google Calendar.</p>
            </div>

            <div class="tabs-header">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('segunda', event)">Seg</button>
                    <button class="tab-btn" onclick="switchTab('terca', event)">Ter</button>
                    <button class="tab-btn" onclick="switchTab('quarta', event)">Qua</button>
                    <button class="tab-btn" onclick="switchTab('quinta', event)">Qui</button>
                    <button class="tab-btn" onclick="switchTab('sexta', event)">Sex</button>
                    <button class="tab-btn" onclick="switchTab('sabado', event)">Sab</button>
                    <button class="tab-btn" onclick="switchTab('domingo', event)">Dom</button>
                </div>
                <button class="add-act-btn" onclick="openCreateModal()" title="Criar nova atividade">+</button>
            </div>

            <div id="tab-container"></div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div id="noteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Atividade</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Descrição da atividade</label>
                    <textarea id="noteText" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeModal('noteModal')">Cancelar</button>
                <button class="modal-btn save" onclick="saveContent()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- MODAL CRIAR -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nova Atividade</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Atividade</label>
                    <input type="text" id="newText" class="form-control" placeholder="Ex: Exercício físico">
                </div>
                <div class="form-group">
                    <label>Horário</label>
                    <input type="time" id="newTime" class="form-control" value="08:00">
                </div>
                <div class="form-group">
                    <label>Dias da Semana</label>
                    <div class="days-selector">
                        <input type="checkbox" id="chk-segunda" value="segunda" class="day-checkbox"><label for="chk-segunda" class="day-label">Seg</label>
                        <input type="checkbox" id="chk-terca" value="terca" class="day-checkbox"><label for="chk-terca" class="day-label">Ter</label>
                        <input type="checkbox" id="chk-quarta" value="quarta" class="day-checkbox"><label for="chk-quarta" class="day-label">Qua</label>
                        <input type="checkbox" id="chk-quinta" value="quinta" class="day-checkbox"><label for="chk-quinta" class="day-label">Qui</label>
                        <input type="checkbox" id="chk-sexta" value="sexta" class="day-checkbox"><label for="chk-sexta" class="day-label">Sex</label>
                        <input type="checkbox" id="chk-sabado" value="sabado" class="day-checkbox"><label for="chk-sabado" class="day-label">Sáb</label>
                        <input type="checkbox" id="chk-domingo" value="domingo" class="day-checkbox"><label for="chk-domingo" class="day-label">Dom</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeModal('createModal')">Cancelar</button>
                <button class="modal-btn save" onclick="createNewActivity()">Criar</button>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '405103894296-n00m60mb021u4os48kcnl4lmhmjkm6oe.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/calendar';
        let isAuthenticated = false;
        let tokenClient;
        let editingRef = null;

                { time: '14:00', text: 'Limpeza diária da caixa de areia' },
                { time: '16:00', text: 'Exercício físico' },
                { time: '17:00', text: 'Estudos' },
                { time: '18:45', text: '🧼 Pendurar toalhas e tapetinhos' },
                { time: '19:00', text: 'Jantar' },
                { time: '20:00', text: 'Leitura' },

            ],

            ],
            quinta: [
                { time: '08:00', text: 'Acordar, banho e escovar os dentes' },
                { time: '08:30', text: 'Ioga e meditação' },
                { time: '09:30', text: 'Café da manhã (colocar comida para descongelar)' },

                { time: '17:00', text: 'Estudos' },

                { time: '19:00', text: 'Jantar' },
                { time: '20:00', text: 'Leitura' },
                { time: '20:30', text: 'Lazer' },
                { time: '21:30', text: 'Arrumação do espaço para o dia seguinte' }
            ],
            sexta: [
                { time: '08:00', text: 'Acordar, banho e escovar os dentes' },
                { time: '08:30', text: 'Ioga e meditação' },
                { time: '09:30', text: 'Café da manhã (colocar comida para descongelar)' },
                { time: '10:15', text: 'Busca por emprego / Atualização de currículo' },
                { time: '12:15', text: 'Almoço' },
                { time: '14:00', text: 'Limpeza diária da caixa de areia' },
                { time: '15:00', text: '🛏️ Organização do quarto' },
                { time: '16:00', text: '🌿 Limpeza da varanda' },
                { time: '16:45', text: 'Exercício físico' },

                { time: '20:00', text: 'Leitura' },
                { time: '20:30', text: 'Lazer' },
                { time: '21:30', text: 'Arrumação do espaço para o dia seguinte' }
            ],
            sabado: [
                { time: '08:00', text: 'Acordar, banho e escovar os dentes' },
                { time: '08:30', text: 'Ioga e meditação' },
                { time: '09:30', text: 'Café da manhã (colocar comida para descongelar)' },
                { time: '10:15', text: 'Busca por emprego / Atualização de currículo' },
                { time: '12:15', text: 'Almoço' },
                { time: '13:00', text: '🚿 Faxina pesada do banheiro' },
                { time: '14:30', text: '🐱 Limpeza do quartinho dos gatos' },
                { time: '15:15', text: '🧺 Lavar roupa de cama e tapete do quarto (quinzenal)' },
                { time: '16:00', text: 'Exercício físico' },
                { time: '17:00', text: 'Estudos' },
                { time: '19:00', text: 'Jantar' },
                { time: '20:00', text: 'Leitura' },
                { time: '20:30', text: 'Lazer' },
                { time: '21:30', text: 'Arrumação do espaço para o dia seguinte' }
            ],
            domingo: [
                { time: '09:00', text: '🍳 Preparo das refeições da semana (arroz, feijão, frango)' },
                { time: '12:00', text: 'Congelamento das refeições' },
                { time: '14:00', text: 'Resto do dia livre' }
            ]
        };

        let currentSchedule = JSON.parse(localStorage.getItem('mySchedule')) || defaultSchedule;

        function saveSchedule() {
            localStorage.setItem('mySchedule', JSON.stringify(currentSchedule));
            renderTables();
        }

        function renderTables() {
            const container = document.getElementById('tab-container');
            container.innerHTML = '';

            Object.keys(currentSchedule).forEach((day, index) => {
                const dayDiv = document.createElement('div');
                dayDiv.id = day;
                dayDiv.className = `tab-content ${index === 0 ? 'active' : ''}`;

                currentSchedule[day].sort((a, b) => a.time.localeCompare(b.time));

                let rowsHtml = currentSchedule[day].map((item, idx) => `
                    <tr>
                        <td class="time">${item.time}</td>
                        <td>
                            <span class="sync-indicator"></span>${item.text}
                            <button class="edit-btn" onclick="openEditModal('${day}', ${idx})">✏️</button>
                            <button class="delete-btn" onclick="deleteActivity('${day}', ${idx})">🗑️</button>
                        </td>
                    </tr>
                `).join('');

                dayDiv.innerHTML = `<table><tr><th>Horário</th><th>Atividade</th></tr>${rowsHtml}</table>`;
                container.appendChild(dayDiv);
            });
        }

        function switchTab(day, event) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(day).classList.add('active');
            event.target.classList.add('active');
        }

        function openEditModal(day, index) {
            editingRef = { day, index };
            document.getElementById('noteText').value = currentSchedule[day][index].text;
            document.getElementById('noteModal').classList.add('show');
        }

        function openCreateModal() {
            document.getElementById('newText').value = '';
            document.getElementById('newTime').value = '08:00';
            document.querySelectorAll('.day-checkbox').forEach(chk => chk.checked = false);
            
            const activeTab = document.querySelector('.tab-content.active');
            if (activeTab) {
                const currentDay = activeTab.id;
                const activeChk = document.getElementById(`chk-${currentDay}`);
                if (activeChk) activeChk.checked = true;
            }
            
            document.getElementById('createModal').classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
            editingRef = null;
        }

        function saveContent() {
            if (editingRef) {
                const { day, index } = editingRef;
                currentSchedule[day][index].text = document.getElementById('noteText').value;
                saveSchedule();
                closeModal('noteModal');
            }
        }

        function createNewActivity() {
            const text = document.getElementById('newText').value.trim();
            const time = document.getElementById('newTime').value;
            const checkedDays = Array.from(document.querySelectorAll('.day-checkbox:checked')).map(c => c.value);

            if (!text) {
                alert('Informe o nome da atividade.');
                return;
            }
            if (checkedDays.length === 0) {
                alert('Selecione pelo menos um dia da semana.');
                return;
            }

            checkedDays.forEach(day => {
                if (!currentSchedule[day]) currentSchedule[day] = [];
                currentSchedule[day].push({ time, text });
            });

            saveSchedule();
            closeModal('createModal');
        }

        function deleteActivity(day, index) {
            if (confirm('Deseja excluir esta atividade?')) {
                currentSchedule[day].splice(index, 1);
                saveSchedule();
            }
        }

        function generateValidEventId(date, time) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const [hour, minute] = time.split(':');
            return `cron${yyyy}${mm}${dd}${hour}${minute}`;
        }

        function handleConnectClick() {
            if (isAuthenticated) {
                isAuthenticated = false;
                localStorage.removeItem('googleToken');
                updateAuthUI();
            } else {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            }
        }

        window.addEventListener('load', () => {
            renderTables();
            initializeGoogleAuth();
            const today = new Date();
            document.getElementById('monthInfo').textContent = `📆 Sincronizando para: ${today.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}`;
        });

        function initializeGoogleAuth() {
            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: (response) => {
                        if (response.access_token) {
                            isAuthenticated = true;
                            localStorage.setItem('googleToken', response.access_token);
                            updateAuthUI();
                        }
                    }
                });
                if (localStorage.getItem('googleToken')) {
                    isAuthenticated = true;
                    updateAuthUI();
                }
            } catch (e) { console.error(e); }
        }

        function updateAuthUI() {
            document.getElementById('connectBtn').textContent = isAuthenticated ? '🔓 Desconectar' : '🔗 Conectar Google';
            document.getElementById('syncBtn').disabled = !isAuthenticated;
            document.getElementById('desyncBtn').disabled = !isAuthenticated;
            document.getElementById('syncStatus').className = `sync-status ${isAuthenticated ? 'synced' : 'disconnected'}`;
            document.getElementById('syncStatus').textContent = isAuthenticated ? '✅ Pronto' : '🔴 Desconectado';
        }

        async function syncNow() {
            const token = localStorage.getItem('googleToken');
            if (!token) return;

            document.getElementById('syncStatus').textContent = '🔄 Sincronizando...';
            const today = new Date();
            const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
            const dayNames = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];

            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(today.getFullYear(), today.getMonth(), d);
                const dayName = dayNames[date.getDay()];
                const activities = currentSchedule[dayName] || [];

                for (let act of activities) {
                    const eventId = generateValidEventId(date, act.time);
                    const [hour, minute] = act.time.split(':');
                    const start = new Date(date); start.setHours(hour, minute, 0);
                    const end = new Date(date); end.setHours(parseInt(hour) + 1, minute, 0);

                    const event = {
                        summary: act.text,
                        start: { dateTime: start.toISOString(), timeZone: 'America/Sao_Paulo' },
                        end: { dateTime: end.toISOString(), timeZone: 'America/Sao_Paulo' }
                    };

                    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify(event)
                    }).then(async res => {
                        if (res.status === 404) {
                            event.id = eventId;
                            await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify(event)
                            });
                        }
                    });
                }
            }
            document.getElementById('syncStatus').textContent = '✅ Concluído';
        }

        async function desyncNow() {
            const token = localStorage.getItem('googleToken');
            if (!token || !confirm('Excluir eventos sincronizados deste mês no Google Calendar?')) return;

            document.getElementById('syncStatus').textContent = '🔄 Dessincronizando...';
            const today = new Date();
            const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
            const dayNames = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];

            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(today.getFullYear(), today.getMonth(), d);
                const dayName = dayNames[date.getDay()];
                const activities = currentSchedule[dayName] || [];

                for (let act of activities) {
                    const eventId = generateValidEventId(date, act.time);
                    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                }
            }
            document.getElementById('syncStatus').textContent = '✅ Removido';
        }
    </script>
</body>
</html>
