<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Semanal + Google Calendar</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* ... (mesmo CSS do original) ... */
    </style>
</head>
<body>
    <!-- ... (mesmo HTML do original) ... -->
    
    <script>
        const CLIENT_ID = '405103894296-n00m60mb021u4os48kcnl4lmhmjkm6oe.apps.googleusercontent.com';
        const CALENDAR_ID = 'primary';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.events'; // CORRIGIDO
        const TIME_REGEX = /^([01]\d|2[0-3]):([0-5]\d)$/;
        const STORAGE_KEY = 'weeklyScheduleData'; // NOVO

        let isAuthenticated = false;
        let tokenClient;

        // ============ SISTEMA DE PERSISTÊNCIA ============
        
        function saveScheduleToStorage() {
            const schedule = {};
            const days = ['segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado', 'domingo'];
            
            days.forEach(day => {
                const table = document.getElementById(`${day}-table`);
                if (!table) return;
                
                const rows = table.querySelectorAll('tr');
                const activities = [];
                
                rows.forEach((row, index) => {
                    if (index === 0) return;
                    const timeCell = row.querySelector('.time');
                    const activityCell = row.querySelector('.activity-cell');
                    
                    if (timeCell && activityCell) {
                        activities.push({
                            time: timeCell.dataset.time,
                            activity: activityCell.dataset.activity
                        });
                    }
                });
                
                schedule[day] = activities;
            });
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
        }

        function loadScheduleFromStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return false;
            
            try {
                const schedule = JSON.parse(saved);
                const days = ['segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado', 'domingo'];
                
                days.forEach(day => {
                    if (!schedule[day]) return;
                    
                    const table = document.getElementById(`${day}-table`);
                    if (!table) return;
                    
                    const header = table.querySelector('tr');
                    table.innerHTML = '';
                    table.appendChild(header);
                    
                    schedule[day].forEach(item => {
                        const row = document.createElement('tr');
                        
                        const timeCell = document.createElement('td');
                        timeCell.className = 'time';
                        timeCell.dataset.time = item.time;
                        timeCell.textContent = item.time;
                        timeCell.addEventListener('click', () => {
                            editTime(day, timeCell, item.time);
                        });
                        
                        const activityCell = document.createElement('td');
                        activityCell.className = 'activity-cell';
                        activityCell.dataset.activity = item.activity;
                        
                        row.appendChild(timeCell);
                        row.appendChild(activityCell);
                        table.appendChild(row);
                        
                        renderActivityCell(activityCell);
                    });
                });
                
                return true;
            } catch (e) {
                console.error('Erro ao carregar dados salvos:', e);
                return false;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function resetToDefault() {
            if (!confirm('⚠️ Isso vai restaurar o cronograma para o padrão inicial. Todas as alterações serão perdidas. Continuar?')) {
                return;
            }
            
            localStorage.removeItem(STORAGE_KEY);
            window.location.reload();
        }

        // ============ FUNÇÕES DE RENDERIZAÇÃO ============

        function renderActivityCell(cell) {
            const day = cell.closest('table').id.replace('-table', '');
            const time = cell.closest('tr').querySelector('.time').dataset.time;
            const activity = cell.dataset.activity;

            cell.innerHTML = '';

            const indicator = document.createElement('span');
            indicator.className = 'sync-indicator synced';
            cell.appendChild(indicator);

            const textSpan = document.createElement('span');
            textSpan.className = 'activity-text';
            textSpan.textContent = activity;
            cell.appendChild(textSpan);

            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.textContent = '✏️';
            editBtn.addEventListener('click', (e) => openEditModal(day, time, activity, e));
            cell.appendChild(editBtn);

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = '🗑️';
            delBtn.addEventListener('click', (e) => deleteActivity(day, cell, e));
            cell.appendChild(delBtn);
        }

        function renderAllActivityCells() {
            document.querySelectorAll('.activity-cell').forEach(renderActivityCell);
        }

        function attachTimeClickHandlers() {
            document.querySelectorAll('.time').forEach(cell => {
                cell.addEventListener('click', () => {
                    const day = cell.closest('table').id.replace('-table', '');
                    editTime(day, cell, cell.dataset.time);
                });
            });
        }

        function sortTableByTime(table) {
            let rows = Array.from(table.rows).slice(1);
            rows.sort((a, b) => {
                let timeA = a.querySelector('.time').dataset.time;
                let timeB = b.querySelector('.time').dataset.time;
                return timeA.localeCompare(timeB);
            });
            rows.forEach(row => table.appendChild(row));
        }

        // ============ FUNÇÕES DE EDIÇÃO ============

        function saveNewActivity() {
            const name = document.getElementById('newActivityName').value.trim();
            const time = document.getElementById('newActivityTime').value;
            const selectedDays = Array.from(document.querySelectorAll('input[name="newDay"]:checked')).map(cb => cb.value);

            if (!name) {
                alert('Por favor, informe o nome da atividade.');
                return;
            }
            if (!time || !TIME_REGEX.test(time)) {
                alert('Por favor, informe um horário válido no formato HH:MM.');
                return;
            }
            if (selectedDays.length === 0) {
                alert('Por favor, selecione pelo menos um dia da semana.');
                return;
            }

            selectedDays.forEach(day => {
                const table = document.getElementById(`${day}-table`);
                if (!table) return;

                let rows = Array.from(table.querySelectorAll('tr')).slice(1);
                let existingRow = rows.find(r => r.querySelector('.time').dataset.time === time);

                if (existingRow) {
                    let activityCell = existingRow.querySelector('.activity-cell');
                    activityCell.dataset.activity += `, ${name}`;
                    renderActivityCell(activityCell);
                } else {
                    const newRow = document.createElement('tr');
                    
                    const timeCell = document.createElement('td');
                    timeCell.className = 'time';
                    timeCell.dataset.time = time;
                    timeCell.textContent = time;
                    timeCell.addEventListener('click', () => {
                        editTime(day, timeCell, time);
                    });
                    
                    const activityCell = document.createElement('td');
                    activityCell.className = 'activity-cell';
                    activityCell.dataset.activity = name;
                    
                    newRow.appendChild(timeCell);
                    newRow.appendChild(activityCell);
                    table.appendChild(newRow);
                    
                    sortTableByTime(table);
                    renderActivityCell(activityCell);
                }
            });

            closeAddModal();
            saveScheduleToStorage();
            updateSyncStatus('pending', '⏳ Alterações pendentes de sincronização');
        }

        function deleteActivity(day, cellElement, event) {
            event.stopPropagation();
            if (confirm('Tem certeza que deseja deletar esta atividade?')) {
                const row = cellElement.closest('tr');
                row.remove();
                saveScheduleToStorage();
                updateSyncStatus('pending', '⏳ Alterações pendentes');
            }
        }

        function saveContent() {
            const modal = document.getElementById('noteModal');
            const textarea = document.getElementById('noteText');
            const day = modal.dataset.day;
            const time = modal.dataset.time;
            const newActivity = textarea.value.trim();

            if (!newActivity) {
                alert('A atividade não pode ficar vazia.');
                return;
            }

            const table = document.getElementById(`${day}-table`);
            const rows = table.querySelectorAll('tr');
            for (let row of rows) {
                const timeCell = row.querySelector('.time');
                const activityCell = row.querySelector('.activity-cell');

                if (timeCell && timeCell.dataset.time === time && activityCell) {
                    activityCell.dataset.activity = newActivity;
                    renderActivityCell(activityCell);
                    break;
                }
            }
            closeModal();
            saveScheduleToStorage();
            updateSyncStatus('pending', '⏳ Alterações pendentes');
        }

        function editTime(day, element, currentTime) {
            const newTime = prompt('Editar horário (formato HH:MM):', currentTime);
            if (!newTime || newTime === currentTime) return;

            if (!TIME_REGEX.test(newTime)) {
                alert('Horário inválido. Use o formato HH:MM (ex: 09:30).');
                return;
            }

            const table = element.closest('table');
            const conflict = Array.from(table.querySelectorAll('.time')).some(
                cell => cell !== element && cell.dataset.time === newTime
            );
            if (conflict) {
                alert('Já existe uma atividade nesse horário neste dia.');
                return;
            }

            element.dataset.time = newTime;
            element.textContent = newTime;
            sortTableByTime(table);
            saveScheduleToStorage();
            updateSyncStatus('pending', '⏳ Alterações pendentes');
        }

        // ============ FUNÇÕES DE MODAL ============

        function openEditModal(day, time, activity, event) {
            event.stopPropagation();
            const modal = document.getElementById('noteModal');
            const textarea = document.getElementById('noteText');
            const title = document.getElementById('modalActivityTitle');
            const timeDisplay = document.getElementById('modalActivityTime');
            const label = document.getElementById('noteLabel');

            title.textContent = 'Editar atividade';
            timeDisplay.textContent = time;
            label.textContent = '✏️ Edite a atividade:';
            textarea.value = activity;

            modal.dataset.mode = 'edit';
            modal.dataset.day = day;
            modal.dataset.time = time;
            modal.classList.add('show');
            textarea.focus();
        }

        function openAddModal() {
            document.getElementById('newActivityName').value = '';
            document.getElementById('newActivityTime').value = '';
            document.querySelectorAll('input[name="newDay"]').forEach(cb => cb.checked = false);
            document.getElementById('addModal').classList.add('show');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('show');
        }

        function closeModal() {
            document.getElementById('noteModal').classList.remove('show');
        }

        // ============ FUNÇÕES DE AUTENTICAÇÃO ============

        function handleConnectClick() {
            if (isAuthenticated) {
                isAuthenticated = false;
                localStorage.removeItem('googleToken');
                localStorage.removeItem('googleTokenExpiry');
                document.getElementById('connectBtn').textContent = '🔗 Conectar Google';
                document.getElementById('syncBtn').disabled = true;
                document.getElementById('userInfo').textContent = '';
                updateSyncStatus('disconnected', '🔴 Desconectado');
                window.location.reload();
            } else {
                if (tokenClient) {
                    tokenClient.requestAccessToken({ prompt: 'consent' });
                }
            }
        }

        function initializeGoogleAuth() {
            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: handleCredentialResponse,
                    error_callback: handleAuthError,
                });

                const storedToken = localStorage.getItem('googleToken');
                const expiry = parseInt(localStorage.getItem('googleTokenExpiry') || '0', 10);
                if (storedToken && Date.now() < expiry) {
                    isAuthenticated = true;
                    updateAuthUI();
                } else if (storedToken) {
                    localStorage.removeItem('googleToken');
                    localStorage.removeItem('googleTokenExpiry');
                }
            } catch (e) {
                console.error('Erro ao inicializar auth:', e);
            }
        }

        function handleAuthError(error) {
            console.error('Erro de autenticação:', error);
            updateSyncStatus('error', '❌ Erro: ' + error.error);
        }

        function handleCredentialResponse(response) {
            if (response.access_token) {
                isAuthenticated = true;
                localStorage.setItem('googleToken', response.access_token);
                const expiresInMs = (response.expires_in ? parseInt(response.expires_in, 10) : 3600) * 1000;
                localStorage.setItem('googleTokenExpiry', String(Date.now() + expiresInMs - 30000));
                updateAuthUI();
            }
        }

        function updateAuthUI() {
            if (isAuthenticated) {
                document.getElementById('connectBtn').textContent = '🔓 Desconectar';
                document.getElementById('syncBtn').disabled = false;
                document.getElementById('userInfo').textContent = '✅ Conectado com Google';
                updateSyncStatus('synced', '✅ Pronto para sincronizar');
            } else {
                document.getElementById('connectBtn').textContent = '🔗 Conectar Google';
                document.getElementById('syncBtn').disabled = true;
                document.getElementById('userInfo').textContent = '';
                updateSyncStatus('disconnected', '🔴 Desconectado');
            }
        }

        function updateSyncStatus(status, text) {
            const statusEl = document.getElementById('syncStatus');
            statusEl.className = 'sync-status ' + status;
            statusEl.textContent = text;
        }

        function updateMonthInfo() {
            const today = new Date();
            const monthName = today.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            document.getElementById('monthInfo').textContent = `📆 Sincronizando para: ${monthName}`;
        }

        function getValidToken() {
            const token = localStorage.getItem('googleToken');
            const expiry = parseInt(localStorage.getItem('googleTokenExpiry') || '0', 10);
            if (!token || Date.now() >= expiry) {
                return null;
            }
            return token;
        }

        function forceReauth(reason) {
            isAuthenticated = false;
            localStorage.removeItem('googleToken');
            localStorage.removeItem('googleTokenExpiry');
            updateAuthUI();
            updateSyncStatus('error', '⚠️ Sessão expirada, reconecte');
            if (tokenClient) {
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        // ============ FUNÇÕES DE SINCRONIZAÇÃO ============

        function generateValidEventId(date, time) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const [hour, minute] = time.split(':');
            return `c${year}${month}${day}t${hour}${minute}`;
        }

        function getAllActivitiesFromSchedule() {
            const activities = [];
            const days = ['segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado', 'domingo'];

            days.forEach(day => {
                const table = document.getElementById(`${day}-table`);
                if (!table) return;
                const rows = table.querySelectorAll('tr');

                rows.forEach((row, index) => {
                    if (index === 0) return;
                    const timeCell = row.querySelector('.time');
                    const activityCell = row.querySelector('.activity-cell');

                    if (timeCell && activityCell) {
                        activities.push({
                            day: day,
                            time: timeCell.dataset.time,
                            activity: activityCell.dataset.activity
                        });
                    }
                });
            });

            return activities;
        }

        function createCalendarEvent(activity, date) {
            const [hour, minute] = activity.time.split(':');
            const startDate = new Date(date);
            startDate.setHours(parseInt(hour), parseInt(minute), 0, 0);

            const endDate = new Date(date);
            endDate.setHours(parseInt(hour) + 1, parseInt(minute), 0, 0);

            return {
                'summary': activity.activity,
                'description': `Atividade do cronograma: ${activity.activity}`,
                'start': {
                    'dateTime': startDate.toISOString(),
                    'timeZone': 'America/Sao_Paulo',
                },
                'end': {
                    'dateTime': endDate.toISOString(),
                    'timeZone': 'America/Sao_Paulo',
                },
            };
        }

        async function syncWithGoogleCalendar() {
            const token = getValidToken();
            if (!token) {
                forceReauth('token ausente ou expirado ao iniciar sync');
                return;
            }

            updateSyncStatus('syncing', '🔄 Sincronizando mês...');

            try {
                const activities = getAllActivitiesFromSchedule();
                const today = new Date();
                const currentYear = today.getFullYear();
                const currentMonth = today.getMonth();

                const firstDay = new Date(currentYear, currentMonth, 1);
                const lastDay = new Date(currentYear, currentMonth + 1, 0);
                const daysInMonth = lastDay.getDate();

                let successCount = 0;
                let errorCount = 0;
                let authFailed = false;

                for (let dayOfMonth = 1; dayOfMonth <= daysInMonth && !authFailed; dayOfMonth++) {
                    const date = new Date(currentYear, currentMonth, dayOfMonth);
                    const dayOfWeek = date.getDay();
                    const dayNames = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
                    const dayName = dayNames[dayOfWeek];

                    const dayActivities = activities.filter(a => a.day === dayName);

                    for (let activity of dayActivities) {
                        const event = createCalendarEvent(activity, date);
                        const eventId = generateValidEventId(date, activity.time);

                        try {
                            const updateResponse = await fetch(
                                `https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`,
                                {
                                    method: 'PUT',
                                    headers: {
                                        'Authorization': `Bearer ${token}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify(event)
                                }
                            );

                            if (updateResponse.status === 401) {
                                authFailed = true;
                                break;
                            }

                            if (updateResponse.status === 404) {
                                event.id = eventId;
                                const insertResponse = await fetch(
                                    'https://www.googleapis.com/calendar/v3/calendars/primary/events',
                                    {
                                        method: 'POST',
                                        headers: {
                                            'Authorization': `Bearer ${token}`,
                                            'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify(event)
                                    }
                                );

                                if (insertResponse.status === 401) {
                                    authFailed = true;
                                    break;
                                }

                                if (insertResponse.ok) {
                                    successCount++;
                                } else {
                                    errorCount++;
                                }
                            } else if (updateResponse.ok) {
                                successCount++;
                            } else {
                                errorCount++;
                            }
                        } catch (err) {
                            errorCount++;
                        }
                    }
                }

                if (authFailed) {
                    forceReauth('401 recebido durante sync');
                    return;
                }

                if (errorCount === 0) {
                    updateSyncStatus('synced', '✅ Sincronizado com sucesso!');
                } else {
                    updateSyncStatus('synced', `✅ Concluído (${errorCount} erros)`);
                }
                setTimeout(() => updateSyncStatus('synced', '✅ Pronto para sincronizar'), 3000);
            } catch (error) {
                updateSyncStatus('error', '❌ Erro: ' + error.message);
            }
        }

        function syncNow() {
            if (getValidToken()) {
                syncWithGoogleCalendar();
            } else {
                forceReauth('sem token válido ao clicar em sincronizar');
            }
        }

        async function desyncNow() {
            const token = getValidToken();
            if (!token) {
                forceReauth('token ausente ou expirado');
                return;
            }

            if (!confirm('⚠️ Deseja deletar todos os eventos sincronizados de ' + getMonthName() + ' do Google Calendar?')) {
                return;
            }

            updateSyncStatus('syncing', '🔄 Dessincronizando...');
            try {
                const activities = getAllActivitiesFromSchedule();
                const today = new Date();
                const currentYear = today.getFullYear();
                const currentMonth = today.getMonth();
                const lastDay = new Date(currentYear, currentMonth + 1, 0);
                const daysInMonth = lastDay.getDate();

                let deletedCount = 0;
                let authFailed = false;

                for (let dayOfMonth = 1; dayOfMonth <= daysInMonth && !authFailed; dayOfMonth++) {
                    const date = new Date(currentYear, currentMonth, dayOfMonth);
                    const dayOfWeek = date.getDay();
                    const dayNames = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
                    const dayName = dayNames[dayOfWeek];

                    const dayActivities = activities.filter(a => a.day === dayName);

                    for (let activity of dayActivities) {
                        const eventId = generateValidEventId(date, activity.time);
                        try {
                            const deleteResponse = await fetch(
                                `https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`,
                                {
                                    method: 'DELETE',
                                    headers: { 'Authorization': `Bearer ${token}` }
                                }
                            );
                            if (deleteResponse.status === 401) {
                                authFailed = true;
                                break;
                            }
                            if (deleteResponse.ok || deleteResponse.status === 404) {
                                deletedCount++;
                            }
                        } catch (err) {}
                    }
                }

                if (authFailed) {
                    forceReauth('401');
                    return;
                }

                updateSyncStatus('synced', `✅ ${deletedCount} eventos removidos`);
                alert(`✅ Dessincronização concluída!\n\n${deletedCount} eventos foram removidos do Google Calendar.`);
                setTimeout(() => updateSyncStatus('synced', '✅ Pronto para sincronizar'), 3000);
            } catch (error) {
                updateSyncStatus('error', '❌ Erro: ' + error.message);
            }
        }

        function getMonthName() {
            const today = new Date();
            return today.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
        }

        // ============ SWITCH TABS ============

        function switchTab(day, event) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(day).classList.add('active');
            if(event) event.target.classList.add('active');
        }

        // ============ INICIALIZAÇÃO ============

        window.addEventListener('load', function() {
            // Tentar carregar dados salvos primeiro
            const loaded = loadScheduleFromStorage();
            
            // Se não houver dados salvos, usar o HTML padrão
            if (!loaded) {
                renderAllActivityCells();
            }
            
            attachTimeClickHandlers();
            initializeGoogleAuth();
            updateMonthInfo();
            
            // Salvar estado inicial se ainda não existir
            if (!localStorage.getItem(STORAGE_KEY)) {
                saveScheduleToStorage();
            }
        });

        // Event listeners para modais
        window.addEventListener('click', function(e) {
            const modal = document.getElementById('noteModal');
            const addModal = document.getElementById('addModal');
            if (e.target === modal) closeModal();
            if (e.target === addModal) closeAddModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeAddModal();
            }
        });

        // Botão para restaurar padrão (adicione no HTML se desejar)
        // <button onclick="resetToDefault()">🔄 Restaurar Padrão</button>
    </script>
</body>
</html>
