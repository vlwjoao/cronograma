        function loadPopupReminder() {
            const saved = localStorage.getItem(REMINDER_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    document.getElementById('popupReminderEnabled').checked = data.enabled !== false;
                    document.getElementById('popupReminderMinutes').value = data.minutes || 10;
                } catch(e) { /* fallback */ }
            }

            const data = {

                minutes: parseInt(document.getElementById('popupReminderMinutes').value) || 10

            localStorage.setItem(REMINDER_KEY, JSON.stringify(data));
        }
        document.addEventListener('change', function(e) {

        function changeWeek(delta) {
            currentWeekOffset += delta;
            updateWeekDisplay();
            const activeTab = document.querySelector('.tab-content.active');
            if (activeTab) {
                const day = activeTab.id;
                filterActivitiesByDate(day);
                updateImportantBox(day);
            }
        }
        function updateWeekDisplay() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - today.getDay() + 1);
            startOfWeek.setDate(startOfWeek.getDate() + currentWeekOffset * 7);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            const format = (d) => d.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
            document.getElementById('weekDisplay').textContent = `${format(startOfWeek)} - ${format(endOfWeek)}`;
            document.getElementById('monthInfo').textContent = `📆 Semana de ${format(startOfWeek)} a ${format(endOfWeek)}`;
        }

        // ===================================================================
        // FUNÇÕES DE DATA PARA PERIODICIDADE
        // ===================================================================
        function getWeekOfMonth(date) {
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
            const dayOfMonth = date.getDate();
            return Math.ceil((dayOfMonth + firstDay) / 7);
        }
        function getOccurrenceOfWeekDay(date) {
            return Math.ceil(date.getDate() / 7);
        }
        function activityOccursToday(activity, date) {
            const period = activity.period || 'semanal';
            if (period === 'semanal') return true;
            const dayOfMonth = date.getDate();
            const month = date.getMonth();
            const year = date.getFullYear();
            const weekOfMonth = getWeekOfMonth(date);
            const dayOfWeek = date.getDay();
            if (period === 'quinzenal') {
                const weeks = activity.semanas || [1,3];
                return weeks.includes(weekOfMonth);
            }
            if (period === 'mensal') {
                const tipo = activity.mensalTipo || 'dia';
                if (tipo === 'dia') {
                    let dia = activity.diaMes || 1;
                    const lastDay = new Date(year, month + 1, 0).getDate();
                    if (dia > lastDay) dia = lastDay;
                    return dayOfMonth === dia;
                } else {
                    const ocorrencia = activity.ocorrencia || 1;
                    const diaSemana = activity.diaSemana || 0;
                    return getOccurrenceOfWeekDay(date) === ocorrencia && dayOfWeek === diaSemana;
                }
            }
            return true;
        }

        // ===================================================================
        // CONTROLE DE STATUS
        // ===================================================================
        function getActivityCell(day, time) {
            const table = document.getElementById(day + '-table');
            if (!table) return null;
            const rows = table.querySelectorAll('tr');
            for (let row of rows) {
                const timeCell = row.querySelector('.time');
                if (timeCell && timeCell.dataset.time === time) {
                    return row.querySelector('.activity-cell');
                }
            }
            return null;
        }
        function setActivityStatus(day, time, status) {
            const cell = getActivityCell(day, time);
            if (!cell) return;
            cell.dataset.syncStatus = status;
            const indicator = cell.querySelector('.sync-indicator');
            if (indicator) indicator.className = 'sync-indicator ' + status;
            updateGlobalStatus();
        }
        function markAllActivitiesAsPending() {
            document.querySelectorAll('.activity-cell').forEach(cell => {
                cell.dataset.syncStatus = 'pending';
                const indicator = cell.querySelector('.sync-indicator');
                if (indicator) indicator.className = 'sync-indicator pending';
            });
            updateGlobalStatus();
        }
        function markAllActivitiesAsSynced() {
            document.querySelectorAll('.activity-cell').forEach(cell => {
                cell.dataset.syncStatus = 'synced';
                const indicator = cell.querySelector('.sync-indicator');
                if (indicator) indicator.className = 'sync-indicator synced';
            });
            updateGlobalStatus();
        }
        function getPendingActivities() {
            const pendings = [];
            document.querySelectorAll('.activity-cell').forEach(cell => {
                if (cell.dataset.syncStatus === 'pending') {
                    const row = cell.closest('tr');
                    const timeCell = row.querySelector('.time');
                    const day = cell.closest('table').id.replace('-table', '');
                    if (timeCell) {
                        pendings.push({
                            day: day,
                            time: timeCell.dataset.time,
                            activity: cell.dataset.activity,
                            duration: parseInt(cell.dataset.duration) || 60,
                            period: cell.dataset.period || 'semanal',
                            semanas: JSON.parse(cell.dataset.semanas || '[1,3]'),
                            mensalTipo: cell.dataset.mensalTipo || 'dia',
                            diaMes: parseInt(cell.dataset.diaMes) || 1,
                            ocorrencia: parseInt(cell.dataset.ocorrencia) || 1,
                            diaSemana: parseInt(cell.dataset.diaSemana) || 0,
                            reminder: parseInt(cell.dataset.reminder) || 0,
                            cell: cell
                        });
                    }
                }
            });
            return pendings;
        }
        function updateGlobalStatus() {
            const pendings = getPendingActivities();
            const totalActivities = document.querySelectorAll('.activity-cell').length;
            const el = document.getElementById('syncStatus');
            if (totalActivities === 0) {
                setGlobalSyncStatus('disconnected', '📭 Nenhuma atividade');
                return;
            }
            if (pendings.length === 0) {
                setGlobalSyncStatus('synced', '✅ Tudo sincronizado');
            } else {
                setGlobalSyncStatus('pending', `⏳ ${pendings.length} pendente${pendings.length > 1 ? 's' : ''}`);
            }
        }
        function setGlobalSyncStatus(status, text) {
            globalSyncStatus = status;
            const el = document.getElementById('syncStatus');
            const texts = {

                'pending': '⏳ Pendente',
                'disconnected': '🔴 Desconectado',
                'error': '❌ Erro',

            };
            el.className = 'sync-status ' + status;
            el.textContent = text || texts[status] || '🔴 Desconectado';
        }
        function loadGlobalStatusFromStorage() {
            const saved = localStorage.getItem(SYNC_STATUS_KEY);
            if (saved) {
                globalSyncStatus = saved;
            } else {
                globalSyncStatus = 'disconnected';
            }
            updateGlobalStatus();
        }

        let currentEmojiTarget = null;
        function openEmojiPicker(targetId) {
            currentEmojiTarget = targetId;
            document.getElementById('emojiPicker').classList.add('active');
            document.getElementById('emojiOverlay').classList.add('active');
            document.getElementById('emojiSearch').value = '';
            renderEmojis(Object.keys(EMOJIS));
            document.getElementById('emojiSearch').focus();
        }
        function closeEmojiPicker() {
            document.getElementById('emojiPicker').classList.remove('active');
            document.getElementById('emojiOverlay').classList.remove('active');
            currentEmojiTarget = null;
        }
        function renderEmojis(emojiList) {
            const grid = document.getElementById('emojiGrid');
            grid.innerHTML = '';
            let lastCategory = '';
            emojiList.forEach(emoji => {
                const category = EMOJIS[emoji] || 'Outros';
                if (category !== lastCategory) {
                    lastCategory = category;
                    const catLabel = document.createElement('div');
                    catLabel.className = 'emoji-category';
                    catLabel.textContent = category;
                    grid.appendChild(catLabel);
                }
                const btn = document.createElement('button');
                btn.className = 'emoji-item';
                btn.textContent = emoji;
                btn.onclick = () => insertEmoji(emoji);
                grid.appendChild(btn);
            });
            if (emojiList.length === 0) {
                const empty = document.createElement('div');
                empty.style.gridColumn = '1 / -1';
                empty.style.textAlign = 'center';
                empty.style.padding = '20px';
                empty.style.color = '#999';
                empty.textContent = 'Nenhum emoji encontrado';
                grid.appendChild(empty);
            }
        }
        function filterEmojis() {
            const search = document.getElementById('emojiSearch').value.toLowerCase();
            const filtered = Object.keys(EMOJIS).filter(emoji => 
                emoji.includes(search) || 
                EMOJIS[emoji].toLowerCase().includes(search) ||
                emoji.toLowerCase().includes(search)
            );
            renderEmojis(filtered);
        }
        function insertEmoji(emoji) {
            if (currentEmojiTarget) {
                const input = document.getElementById(currentEmojiTarget);
                if (input) {
                    const cursorPos = input.selectionStart || input.value.length;
                    const textBefore = input.value.substring(0, cursorPos);
                    const textAfter = input.value.substring(cursorPos);
                    input.value = textBefore + emoji + textAfter;
                    input.focus();
                    input.selectionStart = input.selectionEnd = cursorPos + emoji.length;
                }
            }
            closeEmojiPicker();
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeEmojiPicker();
        });

        function getPeriodData(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return null;
            const periodRadio = container.querySelector('input[name="' + containerId + '_period"]:checked');
            if (!periodRadio) return null;
            const period = periodRadio.value;
            const data = { period };

            if (period === 'quinzenal') {
                const checks = container.querySelectorAll('input[name="' + containerId + '_weeks"]:checked');
                data.semanas = Array.from(checks).map(cb => parseInt(cb.value));
                if (data.semanas.length === 0) data.semanas = [1,3];
            } else if (period === 'mensal') {
                const tipoRadio = container.querySelector('input[name="' + containerId + '_mensalTipo"]:checked');
                if (tipoRadio) {
                    data.mensalTipo = tipoRadio.value;
                    if (data.mensalTipo === 'dia') {
                        const diaInput = container.querySelector('input[name="' + containerId + '_diaMes"]');
                        data.diaMes = parseInt(diaInput.value) || 1;
                    } else {
                        const occSelect = container.querySelector('select[name="' + containerId + '_ocorrencia"]');
                        const diaSelect = container.querySelector('select[name="' + containerId + '_diaSemana"]');
                        data.ocorrencia = parseInt(occSelect.value) || 1;
                        data.diaSemana = parseInt(diaSelect.value) || 0;
                    }
                } else {
                    data.mensalTipo = 'dia';
                    data.diaMes = 1;
                }
            }
            return data;
        }

        // ===================================================================
        // FUNÇÕES DE FILTRO POR DATA E PERIODICIDADE
        // ===================================================================
        function getStartOfWeek(offset) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const start = new Date(today);
            start.setDate(today.getDate() - today.getDay() + 1);
            start.setDate(start.getDate() + offset * 7);
            return start;
        }

        function filterActivitiesByDate(day) {
            const table = document.getElementById(day + '-table');
            if (!table) return;
            const rows = table.querySelectorAll('tr');
            const dayMap = { 'segunda':1, 'terca':2, 'quarta':3, 'quinta':4, 'sexta':5, 'sabado':6, 'domingo':0 };
            const dayIndex = dayMap[day];
            const startOfWeek = getStartOfWeek(currentWeekOffset);
            const date = new Date(startOfWeek);
            date.setDate(startOfWeek.getDate() + (dayIndex - 1) % 7);
            if (dayIndex === 0) date.setDate(startOfWeek.getDate() + 6);

            rows.forEach((row, index) => {
                if (index === 0) return;
                const activityCell = row.querySelector('.activity-cell');
                if (!activityCell) return;
                const period = activityCell.dataset.period || 'semanal';
                const timeCell = row.querySelector('.time');
                if (!timeCell) return;
                const activityObj = {
                    period: period,
                    semanas: JSON.parse(activityCell.dataset.semanas || '[1,3]'),
                    mensalTipo: activityCell.dataset.mensalTipo || 'dia',
                    diaMes: parseInt(activityCell.dataset.diaMes) || 1,
                    ocorrencia: parseInt(activityCell.dataset.ocorrencia) || 1,
                    diaSemana: parseInt(activityCell.dataset.diaSemana) || 0
                };
                const occurs = activityOccursToday(activityObj, date);
                row.style.display = occurs ? '' : 'none';
            });
        }

        // EDIÇÃO
        // ===================================================================
        function openEditModal(day, time, activity, duration, period, reminder, data, event) {
            event.stopPropagation();
            const modal = document.getElementById('noteModal');
            document.getElementById('editActivityName').value = activity;
            document.getElementById('editDuration').value = duration || 60;
            document.getElementById('editReminder').value = reminder || '';
            document.getElementById('modalActivityTitle').textContent = 'Editar Atividade';
            document.getElementById('modalActivityTime').textContent = time;
            document.getElementById('noteLabel').textContent = '✏️ Edite a atividade:';
            modal.dataset.day = day;
            modal.dataset.time = time;

            const periodData = {
                period: period || 'semanal',
                semanas: data.semanas ? JSON.parse(data.semanas) : [1,3],
                mensalTipo: data.mensalTipo || 'dia',
                diaMes: parseInt(data.diaMes) || 1,
                ocorrencia: parseInt(data.ocorrencia) || 1,
                diaSemana: parseInt(data.diaSemana) || 0
            };
            renderPeriodOptions('editPeriodContainer', periodData.period, periodData);

            const selectedDays = data.days ? JSON.parse(data.days) : [day];
            document.querySelectorAll('#editDayGroup input[type="checkbox"]').forEach(cb => {
                cb.checked = selectedDays.includes(cb.value);
            });

            modal.classList.add('show');
            document.getElementById('editActivityName').focus();
        }

        function saveContent() {
            if (isSyncing) { alert('⚠️ Aguarde a sincronização.'); return; }
            const modal = document.getElementById('noteModal');
            const activityInput = document.getElementById('editActivityName');
            const durationInput = document.getElementById('editDuration');
            const reminderInput = document.getElementById('editReminder');
            const day = modal.dataset.day;
            const time = modal.dataset.time;
            const newActivity = activityInput.value.trim();
            const newDuration = parseInt(durationInput.value) || 60;
            const newReminder = parseInt(reminderInput.value) || 0;
            const periodData = getPeriodData('editPeriodContainer');
            const selectedDays = Array.from(document.querySelectorAll('#editDayGroup input[type="checkbox"]:checked')).map(cb => cb.value);
            
            if (!newActivity) { alert('A atividade não pode ficar vazia.'); return; }
            if (newDuration < 1) { alert('Duração mínima: 1 minuto.'); return; }
            if (newReminder < 0) { alert('Lembrete não pode ser negativo.'); return; }
            if (!(periodData && periodData.period === 'mensal' && periodData.mensalTipo === 'dia')) {
                if (selectedDays.length === 0) {
                    alert('Selecione pelo menos um dia da semana.');
                    return;
                }
            }
            
            const table = document.getElementById(day+'-table');
            const rows = table.querySelectorAll('tr');
            for (let row of rows) {
                const timeCell = row.querySelector('.time');
                const activityCell = row.querySelector('.activity-cell');
                if (timeCell && timeCell.dataset.time === time && activityCell) {
                    activityCell.dataset.activity = newActivity;
                    activityCell.dataset.duration = newDuration;
                    activityCell.dataset.reminder = newReminder;
                    if (periodData) {
                        activityCell.dataset.period = periodData.period;
                        if (periodData.period === 'quinzenal') {
                            activityCell.dataset.semanas = JSON.stringify(periodData.semanas);
                        } else if (periodData.period === 'mensal') {
                            activityCell.dataset.mensalTipo = periodData.mensalTipo;
                            if (periodData.mensalTipo === 'dia') {
                                activityCell.dataset.diaMes = periodData.diaMes;
                            } else {
                                activityCell.dataset.ocorrencia = periodData.ocorrencia;
                                activityCell.dataset.diaSemana = periodData.diaSemana;
                            }
                        }
                    } else {
                        activityCell.dataset.period = 'semanal';
                    }
                    if (selectedDays.length > 0) {
                        activityCell.dataset.days = JSON.stringify(selectedDays);
                    } else {
                        activityCell.dataset.days = JSON.stringify([day]);
                    }
                    activityCell.dataset.syncStatus = 'pending';
                    renderActivityCell(activityCell);
                    break;
                }
            }
            closeModal();
            saveScheduleToStorage();
            updateGlobalStatus();
            const activeTab = document.querySelector('.tab-content.active');
            if (activeTab) filterActivitiesByDate(activeTab.id);
        }

        function checkDuplicateByName(day, name, timeToIgnore) {
            const table = document.getElementById(day + '-table');
            if (!table) return false;
            const rows = table.querySelectorAll('tr');
            const cleanName = name.toLowerCase().trim();
            for (let row of rows) {
                const timeCell = row.querySelector('.time');
                const activityCell = row.querySelector('.activity-cell');
                if (activityCell && timeCell) {
                    const existingName = activityCell.dataset.activity.toLowerCase().trim();
                    const existingTime = timeCell.dataset.time;
                    if (existingName === cleanName && (timeToIgnore === undefined || existingTime !== timeToIgnore)) {
                        return true;
                    }
                }
            }
            return false;
        }

        function saveNewActivity() {
            if (isSyncing) { alert('⚠️ Aguarde a sincronização.'); return; }
            const name = document.getElementById('newActivityName').value.trim();
            const time = document.getElementById('newActivityTime').value;
            const duration = parseInt(document.getElementById('newActivityDuration').value) || 60;
            const reminder = parseInt(document.getElementById('newActivityReminder').value) || 0;
            const periodData = getPeriodData('addPeriodContainer');
            
            if (!name) { alert('Informe o nome da atividade.'); return; }
            if (!time || !TIME_REGEX.test(time)) { alert('Informe um horário válido (HH:MM).'); return; }
            if (duration < 1) { alert('Duração mínima: 1 minuto.'); return; }
            if (reminder < 0) { alert('Lembrete não pode ser negativo.'); return; }

            // ===== CORREÇÃO: Para mensal com dia fixo, seleciona automaticamente todos os dias da semana =====
            let selectedDays = Array.from(document.querySelectorAll('input[name="newDay"]:checked')).map(cb => cb.value);
            if (periodData && periodData.period === 'mensal' && periodData.mensalTipo === 'dia') {
                selectedDays = ['segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado', 'domingo'];
            } else {
                if (selectedDays.length === 0) {
                    alert('Selecione pelo menos um dia da semana.');
                    return;
                }
            }

            const dupDays = [];
            selectedDays.forEach(day => {
                if (checkDuplicateByName(day, name)) {
                    dupDays.push(day);
                }
            });
            if (dupDays.length > 0) {
                const msg = `⚠️ A atividade "${name}" já existe em: ${dupDays.join(', ')}.\nDeseja adicionar mesmo assim?`;
                if (!confirm(msg)) return;
            }
            
            selectedDays.forEach(day => {
                const table = document.getElementById(day+'-table');
                if (!table) return;
                let rows = Array.from(table.querySelectorAll('tr')).slice(1);
                let existingRow = rows.find(r => r.querySelector('.time').dataset.time === time);
                if (existingRow) {
                    let activityCell = existingRow.querySelector('.activity-cell');
                    activityCell.dataset.activity += `, ${name}`;
                    activityCell.dataset.reminder = reminder;
                    activityCell.dataset.syncStatus = 'pending';
                    // Atualiza periodicidade se existir

                        activityCell.dataset.period = periodData.period;
                        if (periodData.period === 'quinzenal') {
                            activityCell.dataset.semanas = JSON.stringify(periodData.semanas);
                        } else if (periodData.period === 'mensal') {
                            activityCell.dataset.mensalTipo = periodData.mensalTipo;
                            if (periodData.mensalTipo === 'dia') {
                                activityCell.dataset.diaMes = periodData.diaMes;
                            } else {
                                activityCell.dataset.ocorrencia = periodData.ocorrencia;
                                activityCell.dataset.diaSemana = periodData.diaSemana;
                            }
                        }
                    } else {
                        activityCell.dataset.period = 'semanal';
                    }
                    renderActivityCell(activityCell);
                } else {
                    const newRow = document.createElement('tr');
                    const timeCell = document.createElement('td');
                    timeCell.className = 'time';
                    timeCell.dataset.time = time;
                    timeCell.textContent = time;
                    timeCell.addEventListener('click', () => editTime(day, timeCell, time));
                    const activityCell = document.createElement('td');
                    activityCell.className = 'activity-cell';
                    activityCell.dataset.activity = name;
                    activityCell.dataset.duration = duration;
                    activityCell.dataset.reminder = reminder;
                    if (periodData) {
                        activityCell.dataset.period = periodData.period;
                        if (periodData.period === 'quinzenal') {
                            activityCell.dataset.semanas = JSON.stringify(periodData.semanas);
                        } else if (periodData.period === 'mensal') {
                            activityCell.dataset.mensalTipo = periodData.mensalTipo;
                            if (periodData.mensalTipo === 'dia') {
                                activityCell.dataset.diaMes = periodData.diaMes;
                            } else {
                                activityCell.dataset.ocorrencia = periodData.ocorrencia;
                                activityCell.dataset.diaSemana = periodData.diaSemana;
                            }
                        }
                    } else {
                        activityCell.dataset.period = 'semanal';
                    }
                    if (selectedDays.length > 0) {

        function editTime(day, element, currentTime) {
            if (isSyncing) { alert('⚠️ Aguarde a sincronização.'); return; }

            if (!newTime || newTime === currentTime) return;

        function updateImportantBox(day) {
            const listEl = document.getElementById(`important-list-${day}`);
            if (!listEl) return;
            const table = document.getElementById(`${day}-table`);
            if (!table) return;
            const rows = table.querySelectorAll('tr');

            rows.forEach((row, index) => {
                if (index === 0) return;

                const timeCell = row.querySelector('.time');

            listEl.innerHTML = '';

                return;

            importantItems.sort((a,b) => a.time.localeCompare(b.time));
            importantItems.forEach(item => {
                const emojiMatch = item.activity.match(/\p{Emoji}/u);
                const emoji = emojiMatch ? emojiMatch[0] : '⭐';
                const li = document.createElement('li');
                li.innerHTML = `<span class="imp-time">${item.time}</span><span class="imp-emoji">${emoji}</span><span>${item.activity}</span>`;
                listEl.appendChild(li);

        function saveScheduleToStorage() {
            const schedule = {};
            const days = ['segunda','terca','quarta','quinta','sexta','sabado','domingo'];
            days.forEach(day => {
                const table = document.getElementById(day+'-table');
                if (!table) return;
                const rows = table.querySelectorAll('tr');
                const activities = [];
                rows.forEach((row, index) => {
                    if (index === 0) return;
                    const timeCell = row.querySelector('.time');
                    const activityCell = row.querySelector('.activity-cell');
                    if (timeCell && activityCell) {
                        const duration = parseInt(activityCell.dataset.duration) || 60;
                        const period = activityCell.dataset.period || 'semanal';
                        const reminder = parseInt(activityCell.dataset.reminder) || 0;
                        const item = {
                            time: timeCell.dataset.time,
                            activity: activityCell.dataset.activity,
                            duration: duration,
                            period: period,
                            reminder: reminder,
                            syncStatus: activityCell.dataset.syncStatus || 'pending'
                        };
                        if (period === 'quinzenal') {
                            item.semanas = JSON.parse(activityCell.dataset.semanas || '[1,3]');
                        } else if (period === 'mensal') {
                            item.mensalTipo = activityCell.dataset.mensalTipo || 'dia';
                            if (item.mensalTipo === 'dia') {
                                item.diaMes = parseInt(activityCell.dataset.diaMes) || 1;
                            } else {
                                item.ocorrencia = parseInt(activityCell.dataset.ocorrencia) || 1;
                                item.diaSemana = parseInt(activityCell.dataset.diaSemana) || 0;
                            }
                        }
                        const daysAttr = activityCell.dataset.days;
                        if (daysAttr) {
                            item.days = JSON.parse(daysAttr);
                        }
                        activities.push(item);
                    }
                });
                schedule[day] = activities;
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
            updateAllImportantBoxes();
        }

        // ===================================================================
        // IMPORTAÇÃO AUTOMÁTICA (CORRIGIDA)
        // ===================================================================
        async function importFromGoogle() {
            if (importDone) return;
            const token = getValidToken();
            if (!token) { forceReauth(); return; }

            const now = new Date();
            const startDate = new Date(now.getFullYear(), now.getMonth(), 1);
            const endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);

            setGlobalSyncStatus('syncing', '⏳ Importando eventos do Google...');
            showProgress(`⏳ Importando eventos de ${startDate.toLocaleDateString('pt-BR')} a ${endDate.toLocaleDateString('pt-BR')}...`);

            try {
                const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${startDate.toISOString()}&timeMax=${endDate.toISOString()}&maxResults=1000&orderBy=startTime&singleEvents=true`;
                const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if (response.status === 401) { forceReauth(); hideProgress(); return; }
                const data = await response.json();
                if (!data.items || data.items.length === 0) {
                    hideProgress();
                    setGlobalSyncStatus('synced', '✅ Nenhum evento encontrado');
                    importDone = true;
                    return;
                }

                const eventosCronograma = data.items.filter(ev => 
                    ev.extendedProperties && 
                    ev.extendedProperties.private && 
                    ev.extendedProperties.private.app === 'cronograma'
                );

                if (eventosCronograma.length === 0) {
                    hideProgress();
                    setGlobalSyncStatus('synced', '✅ Nenhum evento do sistema para importar');
                    importDone = true;
                    return;
                }

                const totalAtividades = document.querySelectorAll('.activity-cell').length;
                if (totalAtividades > 0) {
                    if (!confirm(`📥 Existem ${totalAtividades} atividades no cronograma local.\n\nA importação trará ${eventosCronograma.length} eventos do Google que podem gerar duplicatas.\n\nDeseja continuar?`)) {
                        hideProgress();
                        setGlobalSyncStatus('synced', '✅ Importação cancelada');
                        importDone = true;
                        return;
                    }
                }

                let importedCount = 0;
                const dayMap = { 0:'domingo', 1:'segunda', 2:'terca', 3:'quarta', 4:'quinta', 5:'sexta', 6:'sabado' };

                eventosCronograma.forEach(ev => {
                    const start = new Date(ev.start.dateTime);
                    const end = new Date(ev.end.dateTime);
                    const duration = Math.round((end - start) / 60000);
                    const day = dayMap[start.getDay()];
                    const time = start.toTimeString().slice(0,5);
                    const name = ev.summary;

                    if (!day || !time || !name) return;

                    const table = document.getElementById(day + '-table');
                    if (!table) return;
                    const rows = table.querySelectorAll('tr');
                    let exists = false;
                    for (let row of rows) {
                        const timeCell = row.querySelector('.time');
                        const activityCell = row.querySelector('.activity-cell');
                        if (timeCell && timeCell.dataset.time === time && activityCell) {
                            if (activityCell.dataset.activity.toLowerCase().trim() === name.toLowerCase().trim()) {
                                exists = true;
                                break;
                            }
                        }
                    }
                    if (exists) return;

                    const newRow = document.createElement('tr');
                    const timeCell = document.createElement('td');
                    timeCell.className = 'time';
                    timeCell.dataset.time = time;
                    timeCell.textContent = time;
                    timeCell.addEventListener('click', () => editTime(day, timeCell, time));

                    const activityCell = document.createElement('td');
                    activityCell.className = 'activity-cell';
                    activityCell.dataset.activity = name;
                    activityCell.dataset.duration = duration;
                    activityCell.dataset.period = 'semanal';
                    activityCell.dataset.syncStatus = 'synced';
                    newRow.appendChild(timeCell);
                    newRow.appendChild(activityCell);
                    table.appendChild(newRow);
                    sortTableByTime(table);
                    renderActivityCell(activityCell);
                    importedCount++;
                });

                saveScheduleToStorage();
                updateGlobalStatus();
                alert(`✅ ${importedCount} eventos importados com sucesso!`);
                setGlobalSyncStatus('synced', `✅ ${importedCount} importados`);
                importDone = true;
            } catch (error) {
                setGlobalSyncStatus('error', '❌ Erro: ' + error.message);
                alert('Erro na importação: ' + error.message);
            } finally {
                hideProgress();
            }
        }

        // ===================================================================
        // DESSINCRONIZAR (apenas eventos do sistema)
        // ===================================================================
        async function desyncNow() {
            if (isSyncing) { alert('⚠️ Aguarde a sincronização.'); return; }
            const token = getValidToken();
            if (!token) { forceReauth(); return; }

            const now = new Date();
            const startDate = new Date(now.getFullYear(), now.getMonth(), 1);
            const endDate = new Date(now.getFullYear(), now.getMonth() + 2, 0, 23, 59, 59);

            if (!confirm(`⚠️ Isso vai APAGAR APENAS os eventos criados por este aplicativo no período de ${startDate.toLocaleDateString('pt-BR')} a ${endDate.toLocaleDateString('pt-BR')}.\n\nEventos pessoais/feriados NÃO serão afetados.\n\nTem certeza que deseja continuar?`)) {
                return;
            }

            isSyncing = true;
            setButtonsEnabled(false);
            showProgress('⏳ Dessincronizando (apenas eventos do sistema)...');
            setGlobalSyncStatus('syncing', '🔄 Dessincronizando...');

            try {
                const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${startDate.toISOString()}&timeMax=${endDate.toISOString()}&maxResults=1000&singleEvents=true`;
                const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if (response.status === 401) { forceReauth(); hideProgress(); isSyncing = false; setButtonsEnabled(true); return; }
                const data = await response.json();
                if (!data.items || data.items.length === 0) {
                    alert('Nenhum evento encontrado no período.');
                    hideProgress();
                    setGlobalSyncStatus('synced', '✅ Nenhum evento para apagar');
                    isSyncing = false;
                    setButtonsEnabled(true);
                    return;
                }

                const eventosSistema = data.items.filter(ev => 
                    ev.extendedProperties && 
                    ev.extendedProperties.private && 
                    ev.extendedProperties.private.app === 'cronograma'
                );

                if (eventosSistema.length === 0) {
                    alert('Nenhum evento do sistema encontrado no período.');
                    hideProgress();
                    setGlobalSyncStatus('synced', '✅ Nenhum evento do sistema para apagar');
                    isSyncing = false;
                    setButtonsEnabled(true);
                    return;
                }

                const total = eventosSistema.length;
                let deletedCount = 0;
                for (let i = 0; i < total; i++) {
                    const ev = eventosSistema[i];
                    try {
                        const delRes = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${ev.id}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (delRes.status === 401) { throw new Error('401'); }
                        if (delRes.ok) deletedCount++;
                    } catch (err) {
                        if (err.message === '401') { forceReauth(); hideProgress(); isSyncing = false; setButtonsEnabled(true); return; }
                    }
                    updateProgress(i + 1, total);
                }

                markAllActivitiesAsPending();
                saveScheduleToStorage();

                alert(`✅ ${deletedCount} eventos do sistema removidos.`);
                setGlobalSyncStatus('pending', `⏳ ${deletedCount} removidos, pendentes`);
                setTimeout(() => updateGlobalStatus(), 3000);
            } catch (error) {
                setGlobalSyncStatus('error', '❌ Erro: ' + error.message);
            } finally {
                hideProgress();
                isSyncing = false;
                setButtonsEnabled(true);
            }
        }

        // ===================================================================
        // SINCRONIZAÇÃO (CORRIGIDA PARA MENSAIS)
        // ===================================================================
        async function syncWithGoogleCalendar() {
            if (isSyncing) { alert('⚠️ Sincronização em andamento.'); return; }
            const token = getValidToken();
            if (!token) { forceReauth(); return; }

            // 1. Processar eventos deletados
            const deleted = getDeletedEvents();
            if (deleted.length > 0) {
                for (let del of deleted) {
                    const dayMap = { 'segunda':1, 'terca':2, 'quarta':3, 'quinta':4, 'sexta':5, 'sabado':6, 'domingo':0 };
                    const dayIndex = dayMap[del.day];
                    const now = new Date();
                    const startOfWeek = getStartOfWeek(0);
                    const date = new Date(startOfWeek);
                    date.setDate(startOfWeek.getDate() + (dayIndex - 1) % 7);
                    if (dayIndex === 0) date.setDate(startOfWeek.getDate() + 6);
                    const eventId = generateValidEventId(date, del.time);
                    try {
                        await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                    } catch(e) {}
                }
                clearDeletedEvents();
            }

            // 2. Processar atividades pendentes
            const pending = getPendingActivities();
            if (pending.length === 0) {
                alert('✅ Nenhuma atividade pendente para sincronizar.');
                return;
            }

            isSyncing = true;
            setButtonsEnabled(false);
            showProgress(`⏳ Sincronizando ${pending.length} atividade${pending.length > 1 ? 's' : ''}...`);
            setGlobalSyncStatus('syncing', `🔄 Sincronizando ${pending.length}...`);

            try {
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const today = now.getDate();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                let successCount = 0, errorCount = 0, authFailed = false;
                let processed = 0;

                for (let activity of pending) {
                    const activityObj = {
                        period: activity.period || 'semanal',
                        semanas: activity.semanas || [1,3],
                        mensalTipo: activity.mensalTipo || 'dia',
                        diaMes: activity.diaMes || 1,
                        ocorrencia: activity.ocorrencia || 1,
                        diaSemana: activity.diaSemana || 0
                    };

                    if (activity.period === 'mensal') {
                        // Sincronizar próximos 6 meses
                        for (let m = 0; m < 6; m++) {
                            const currentMonth = month + m;
                            const currentYear = year + Math.floor(currentMonth / 12);
                            const currentMonthIndex = currentMonth % 12;
                            const lastDay = new Date(currentYear, currentMonthIndex + 1, 0).getDate();
                            for (let d = 1; d <= lastDay; d++) {
                                const date = new Date(currentYear, currentMonthIndex, d);
                                // Pular dias passados no mês atual
                                if (m === 0 && d < today) continue;
                                if (!activityOccursToday(activityObj, date)) continue;
                                const event = createCalendarEvent(activity, date);
                                const eventId = generateValidEventId(date, activity.time);
                                try {
                                    const dayStart = new Date(date);
                                    dayStart.setHours(0,0,0,0);
                                    const dayEnd = new Date(date);
                                    dayEnd.setHours(23,59,59,999);
                                    const searchRes = await fetch(
                                        `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${dayStart.toISOString()}&timeMax=${dayEnd.toISOString()}&q=${encodeURIComponent(activity.activity)}`,
                                        { headers: { 'Authorization': `Bearer ${token}` } }
                                    );
                                    if (searchRes.status === 401) { authFailed = true; break; }
                                    const searchData = await searchRes.json();
                                    let exists = false;
                                    if (searchData.items) {
                                        for (let ev of searchData.items) {
                                            if (ev.summary && ev.summary.toLowerCase().trim() === activity.activity.toLowerCase().trim()) {
                                                exists = true;
                                                break;
                                            }
                                        }
                                    }
                                    if (exists) continue;

                                    const updateRes = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
                                        method: 'PUT',
                                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                                        body: JSON.stringify(event)
                                    });
                                    if (updateRes.status === 401) { authFailed = true; break; }
                                    if (updateRes.status === 404) {
                                        event.id = eventId;
                                        const insertRes = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                                            method: 'POST',
                                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                                            body: JSON.stringify(event)
                                        });
                                        if (insertRes.status === 401) { authFailed = true; break; }
                                        if (insertRes.ok) successCount++;
                                        else errorCount++;
                                    } else if (updateRes.ok) {
                                        successCount++;
                                    } else {
                                        errorCount++;
                                    }
                                } catch (err) { errorCount++; }
                            }
                            if (authFailed) break;
                        }
                    } else {
                        // Semanais e quinzenais: do dia atual até fim do mês
                        for (let d = today; d <= daysInMonth && !authFailed; d++) {
                            const date = new Date(year, month, d);
                            if (!activityOccursToday(activityObj, date)) continue;
                            const event = createCalendarEvent(activity, date);
                            const eventId = generateValidEventId(date, activity.time);
                            try {
                                const dayStart = new Date(date);
                                dayStart.setHours(0,0,0,0);
                                const dayEnd = new Date(date);
                                dayEnd.setHours(23,59,59,999);
                                const searchRes = await fetch(
                                    `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${dayStart.toISOString()}&timeMax=${dayEnd.toISOString()}&q=${encodeURIComponent(activity.activity)}`,
                                    { headers: { 'Authorization': `Bearer ${token}` } }
                                );
                                if (searchRes.status === 401) { authFailed = true; break; }
                                const searchData = await searchRes.json();
                                let exists = false;
                                if (searchData.items) {
                                    for (let ev of searchData.items) {
                                        if (ev.summary && ev.summary.toLowerCase().trim() === activity.activity.toLowerCase().trim()) {
                                            exists = true;
                                            break;
                                        }
                                    }
                                }
                                if (exists) continue;

                                const updateRes = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
                                    method: 'PUT',
                                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                                    body: JSON.stringify(event)
                                });
                                if (updateRes.status === 401) { authFailed = true; break; }
                                if (updateRes.status === 404) {
                                    event.id = eventId;
                                    const insertRes = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                                        method: 'POST',
                                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                                        body: JSON.stringify(event)
                                    });
                                    if (insertRes.status === 401) { authFailed = true; break; }
                                    if (insertRes.ok) successCount++;
                                    else errorCount++;
                                } else if (updateRes.ok) {
                                    successCount++;
                                } else {
                                    errorCount++;
                                }
                            } catch (err) { errorCount++; }
                        }
                    }

                    activity.cell.dataset.syncStatus = 'synced';
                    const indicator = activity.cell.querySelector('.sync-indicator');
                    if (indicator) indicator.className = 'sync-indicator synced';
                    processed++;
                    updateProgress(processed, pending.length);
                    if (authFailed) break;
                }

                if (authFailed) { forceReauth(); hideProgress(); isSyncing = false; setButtonsEnabled(true); return; }

                saveScheduleToStorage();
                updateGlobalStatus();
                const msg = `✅ ${successCount} eventos criados/atualizados (${errorCount} falhas)`;
                setGlobalSyncStatus('synced', msg);
                setTimeout(() => updateGlobalStatus(), 3000);
            } catch (error) {
                setGlobalSyncStatus('error', '❌ Erro: ' + error.message);
            } finally {
                hideProgress();
                isSyncing = false;
                setButtonsEnabled(true);
            }
        }

        // ===================================================================
        // FUNÇÃO AUXILIAR PARA CRIAR EVENTO
        // ===================================================================
        function createCalendarEvent(activity, date) {
            const [hour, minute] = activity.time.split(':');
            const start = new Date(date);
            start.setHours(parseInt(hour), parseInt(minute), 0, 0);
            const end = new Date(date);
            const duration = activity.duration || 60;
            end.setHours(parseInt(hour), parseInt(minute) + duration, 0, 0);
            
            let reminderMinutes = activity.reminder || 0;
            if (reminderMinutes === 0) {
                const global = getReminderSettings();
                if (global.enabled) reminderMinutes = global.minutes;
            }
            const event = {
                summary: activity.activity,
                description: `Atividade do cronograma: ${activity.activity} (${duration}min)`,
                start: { dateTime: start.toISOString(), timeZone: 'America/Sao_Paulo' },
                end: { dateTime: end.toISOString(), timeZone: 'America/Sao_Paulo' },
                extendedProperties: {
                    private: {
                        app: 'cronograma'
                    }
                }
            };
            if (reminderMinutes > 0) {
                event.reminders = {
                    useDefault: false,
                    overrides: [{ method: 'popup', minutes: reminderMinutes }]
                };
            } else {
                event.reminders = { useDefault: false, overrides: [] };
            }
            return event;
        }

        function generateValidEventId(date, time) {
            const year = date.getFullYear();
            const month = String(date.getMonth()+1).padStart(2,'0');
            const day = String(date.getDate()).padStart(2,'0');
            const [hour, minute] = time.split(':');
            return `c${year}${month}${day}t${hour}${minute}`;
        }

        // ===================================================================
        // AUTENTICAÇÃO
        // ===================================================================
        function handleConnectClick() {
            if (isAuthenticated) {
                isAuthenticated = false;
                importDone = false;
                localStorage.removeItem('googleToken');
                localStorage.removeItem('googleTokenExpiry');
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(DELETED_KEY);
                document.getElementById('connectBtn').textContent = '🔗 Conectar Google';
                document.getElementById('syncBtn').disabled = true;
                document.getElementById('desyncBtn').disabled = true;
                document.getElementById('userInfo').textContent = '';
                setGlobalSyncStatus('disconnected', '🔴 Desconectado');
                // Limpar tabelas
                const days = ['segunda','terca','quarta','quinta','sexta','sabado','domingo'];
                days.forEach(day => {
                    const table = document.getElementById(day+'-table');
                    if (!table) return;
                    const header = table.querySelector('tr');
                    table.innerHTML = '';
                    table.appendChild(header);
                });
                updateAllImportantBoxes();
                window.location.reload();
                return;
            }

            if (!tokenClient) {
                console.warn('tokenClient não inicializado. Tentando reinicializar...');
                try {
                    initializeGoogleAuth();
                    setTimeout(() => {
                        if (tokenClient) {
                            tokenClient.requestAccessToken({ prompt: 'consent' });
                        } else {
                            alert('Erro: não foi possível inicializar a autenticação. Recarregue a página.');
                        }
                    }, 300);
                } catch (e) {
                    console.error('Erro ao reinicializar:', e);
                    alert('Erro ao inicializar autenticação. Verifique o console.');
                }
                return;
            }

            try {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } catch (e) {
                console.error('Erro ao solicitar token:', e);
                alert('Erro ao conectar. Verifique o console.');
            }
        }

        function initializeGoogleAuth() {
            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: handleCredentialResponse,
                    error_callback: handleAuthError,
                });
                console.log('tokenClient inicializado.');
                const storedToken = localStorage.getItem('googleToken');
                const expiry = parseInt(localStorage.getItem('googleTokenExpiry') || '0', 10);
                if (storedToken && Date.now() < expiry) {
                    isAuthenticated = true;
                    importDone = true;
                    updateAuthUI();
                } else if (storedToken) {
                    localStorage.removeItem('googleToken');
                    localStorage.removeItem('googleTokenExpiry');
                }
            } catch (e) {
                console.error('Erro ao inicializar autenticação:', e);
                setGlobalSyncStatus('error', '❌ Erro ao inicializar autenticação.');
            }
        }

        function handleAuthError(error) {
            console.error('Erro de autenticação:', error);
            setGlobalSyncStatus('error', '❌ Erro: ' + (error.error || error.message || 'desconhecido'));
        }

        function handleCredentialResponse(response) {
            if (response.access_token) {
                isAuthenticated = true;
                importDone = false;
                localStorage.setItem('googleToken', response.access_token);
                const expiresInMs = (response.expires_in || 3600) * 1000;
                localStorage.setItem('googleTokenExpiry', String(Date.now() + expiresInMs - 30000));
                updateAuthUI();
                setTimeout(() => {
                    importFromGoogle();
                }, 500);
            } else {
                console.error('Resposta sem access_token:', response);
                setGlobalSyncStatus('error', '❌ Erro na autenticação.');
            }
        }

        function updateAuthUI() {
            if (isAuthenticated) {
                document.getElementById('connectBtn').textContent = '🔓 Desconectar';
                document.getElementById('syncBtn').disabled = false;
                document.getElementById('desyncBtn').disabled = false;
                document.getElementById('userInfo').textContent = '✅ Conectado com Google';
                // Carregar dados do localStorage
                const hasData = loadScheduleFromStorage();
                if (!hasData) {
                    // Se não há dados salvos, mostra vazio
                    const days = ['segunda','terca','quarta','quinta','sexta','sabado','domingo'];
                    days.forEach(day => {
                        const table = document.getElementById(day+'-table');
                        if (!table) return;
                        const header = table.querySelector('tr');
                        table.innerHTML = '';
                        table.appendChild(header);
                    });
                    updateAllImportantBoxes();
                }
                updateGlobalStatus();
            } else {
                document.getElementById('connectBtn').textContent = '🔗 Conectar Google';
                document.getElementById('syncBtn').disabled = true;
                document.getElementById('desyncBtn').disabled = true;
                document.getElementById('userInfo').textContent = '';
                setGlobalSyncStatus('disconnected', '🔴 Desconectado');
            }
        }

        function getValidToken() {
            const token = localStorage.getItem('googleToken');
            const expiry = parseInt(localStorage.getItem('googleTokenExpiry') || '0', 10);
            if (!token || Date.now() >= expiry) return null;
            return token;
        }

        function forceReauth() {
            isAuthenticated = false;
            importDone = false;
            localStorage.removeItem('googleToken');
            localStorage.removeItem('googleTokenExpiry');
            updateAuthUI();
            setGlobalSyncStatus('error', '⚠️ Sessão expirada, reconecte');
            if (tokenClient) tokenClient.requestAccessToken({ prompt: '' });
        }

        function syncNow() {
            if (getValidToken()) syncWithGoogleCalendar();
            else forceReauth();
        }

        function setButtonsEnabled(enabled) {
            document.getElementById('syncBtn').disabled = !(enabled && isAuthenticated);
            document.getElementById('desyncBtn').disabled = !(enabled && isAuthenticated);
        }

        function showProgress(message) {
            document.getElementById('progressContainer').classList.add('active');
            document.getElementById('progressMessage').textContent = message || '⏳ Sincronizando...';
            setGlobalSyncStatus('syncing', '🔄 Sincronizando...');
        }
        function updateProgress(current, total) {
            const pct = Math.min(100, Math.round((current / total) * 100));
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPercent').textContent = pct + '%';
        }
        function hideProgress() {
            document.getElementById('progressContainer').classList.remove('active');
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressPercent').textContent = '0%';
        }

        // ===================================================================
        // TABS, INICIALIZAÇÃO
        // ===================================================================
        window.switchTab = function(day, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(day).classList.add('active');
            if (event) event.target.classList.add('active');
            filterActivitiesByDate(day);
            updateImportantBox(day);
        };

        window.addEventListener('load', function() {
            loadPopupReminder();
            loadGlobalStatusFromStorage();
            attachTimeClickHandlers();
            initializeGoogleAuth();
            updateWeekDisplay();
            if (!isAuthenticated) {
                const days = ['segunda','terca','quarta','quinta','sexta','sabado','domingo'];
                days.forEach(day => {
                    const table = document.getElementById(day+'-table');
                    if (!table) return;
                    const header = table.querySelector('tr');
                    table.innerHTML = '';
                    table.appendChild(header);
                });
                updateAllImportantBoxes();
            } else {
                const hasSaved = loadScheduleFromStorage();
                if (!hasSaved) {
                    const days = ['segunda','terca','quarta','quinta','sexta','sabado','domingo'];
                    days.forEach(day => {
                        const table = document.getElementById(day+'-table');
                        if (!table) return;
                        const header = table.querySelector('tr');
                        table.innerHTML = '';
                        table.appendChild(header);
                    });
                    updateAllImportantBoxes();
                }
            }
            const activeTab = document.querySelector('.tab-content.active');
            if (activeTab) {
                filterActivitiesByDate(activeTab.id);
                updateImportantBox(activeTab.id);
            }
            updateGlobalStatus();
        });

        window.addEventListener('click', function(e) {
            if (e.target === document.getElementById('noteModal')) closeModal();
            if (e.target === document.getElementById('addModal')) closeAddModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { 
                closeModal(); 
                closeAddModal();
                closeEmojiPicker();
            }
        });

        function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }
        function closeModal() { document.getElementById('noteModal').classList.remove('show'); }
    </script>
